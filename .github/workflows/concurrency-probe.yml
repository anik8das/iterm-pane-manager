name: Concurrency probe

# Temporary probe: establishes what a fixed concurrency group does to a third
# request while one run is executing. Removed once the answer is recorded.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Which dispatch this is
        required: true
        type: string

concurrency:
  group: concurrency-probe
  cancel-in-progress: false

jobs:
  hold:
    runs-on: ubuntu-latest
    env:
      DISPATCH_TAG: ${{ inputs.tag }}
    steps:
      - name: Announce
        run: echo "dispatch=$DISPATCH_TAG started at $(date -u +%H:%M:%S)"
      - name: Hold the group
        run: sleep 180
      - name: Finish
        run: echo "dispatch=$DISPATCH_TAG finished at $(date -u +%H:%M:%S)"
